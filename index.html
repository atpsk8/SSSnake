<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020a04" />
    <meta name="description" content="SSSnake: a terminal remix of Snake. Coils, mutations, bosses, rhythm, online versus with invite codes, a level editor and a daily challenge." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SSSnake</title>
  </head>
  <body>
    <div id="app">
      <header class="hud" id="hud">
        <span class="hud-item"><span class="k" id="scoreLabel">SCORE</span> <span id="score" class="v big">000000</span></span>
        <span class="hud-item"><span id="mult" class="v">x1.0</span></span>
        <span id="combo" class="hud-item v hot hidden"></span>
        <span id="rewinds" class="hud-item v hidden" title="Rewinds left"></span>
        <span id="effects" class="hud-item v hot"></span>
        <span class="hud-item right"><span class="k" id="levelLabel">CLASSIC</span> <span id="arenaName" class="v">box</span></span>
      </header>

      <div class="meters" id="meters">
        <div class="meter" id="abilityMeter"><span class="k" id="abilityName">SURGE</span><span class="bar"><span id="abilityBar"></span></span></div>
        <div class="meter" id="shedMeter"><span class="k" id="shedName">SHED</span><span class="bar"><span id="shedBar"></span></span></div>
        <div class="meter" id="levelMeter"><span class="k" id="levelMeterName">NEXT</span><span class="bar"><span id="levelBar"></span></span></div>
      </div>
      <div id="mutationRow" class="mutation-row"></div>

      <main id="stage">
        <canvas id="board" aria-label="Game board"></canvas>
        <canvas id="board3d" class="board3d" aria-label="Game board" style="display: none"></canvas>
        <div id="hexGlow" class="hex-glow" aria-hidden="true"></div>

        <div id="replayTag" class="replay-tag hidden" aria-live="polite">
          <span id="replayTitle"></span>
          <span id="replayHint" class="dim"></span>
        </div>

        <div id="banner" class="banner hidden" aria-live="polite">
          <h2 id="bannerTitle"></h2>
          <p id="bannerSub"></p>
        </div>

        <section id="term" class="overlay term">
          <div class="win term-window">
            <div class="win-bar"><span id="termTitle">guest@sssnake: ~</span><span class="win-lights" aria-hidden="true">_ □ x</span></div>
            <div id="termOut" class="term-out" role="log" aria-live="polite"></div>
            <form id="termForm" class="term-line" autocomplete="off">
              <label id="termPrompt" for="termIn"></label>
              <input id="termIn" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="Command" />
            </form>
            <div id="termChips" class="term-chips"></div>
          </div>
        </section>

        <section id="pause" class="overlay hidden">
          <div class="win small">
            <div class="win-bar"><span>paused</span></div>
            <div class="win-body">
              <p id="pauseNote" class="dim hidden">The match keeps running online.</p>
              <button id="resumeBtn" class="primary">[ resume ]</button>
              <button id="restartBtn">[ restart ]</button>
              <button id="settingsBtn">[ settings ]</button>
              <button id="quitBtn">[ quit to terminal ]</button>
            </div>
          </div>
        </section>

        <section id="draft" class="overlay hidden">
          <div class="win">
            <div class="win-bar"><span id="draftTitle">level cleared</span></div>
            <div class="win-body">
              <p class="dim">&gt; select a mutation. it persists for the rest of the run.</p>
              <div id="draftCards" class="draft-cards"></div>
              <p id="draftOwned" class="dim small-text"></p>
            </div>
          </div>
        </section>

        <section id="over" class="overlay hidden">
          <div class="win small">
            <div class="win-bar"><span id="overTitle">process exited</span></div>
            <div class="win-body">
              <p id="overCause" class="dim"></p>
              <div class="final"><span id="finalScore">0</span><em id="newBest" class="hidden">new best</em></div>
              <p id="bestLine" class="dim">best: <strong id="bestScore">0</strong></p>
              <p id="challengeResult" class="challenge-result hidden"></p>
              <p id="onlineStatus" class="challenge-result hidden"></p>
              <dl id="summary" class="summary"></dl>
              <div id="submitBox" class="submit-box hidden">
                <label class="setting">
                  <span>name</span>
                  <input id="nameInput" type="text" maxlength="16" autocomplete="nickname" placeholder="your name" />
                </label>
                <button id="submitBtn">[ submit to global leaderboard ]</button>
                <p id="submitStatus" class="dim small-text"></p>
              </div>
              <button id="retryBtn" class="primary">[ play again ] <kbd>enter</kbd></button>
              <button id="watchBtn">[ watch full replay ]</button>
              <button id="clipBtn">[ save video clip ]</button>
              <button id="shareBtn">[ share challenge link ]</button>
              <button id="overMenuBtn">[ back to terminal ]</button>
            </div>
          </div>
        </section>

        <section id="settings" class="overlay hidden">
          <div class="win small">
            <div class="win-bar"><span>settings</span></div>
            <div class="win-body">
              <label class="setting"><span>name</span><input id="optName" type="text" maxlength="16" placeholder="for leaderboards" /></label>
              <label class="setting">
                <span>theme</span>
                <select id="optTheme">
                  <option value="neo">neo (3d)</option>
                  <option value="terminal">terminal</option>
                  <option value="nokia">nokia lcd</option>
                  <option value="gameboy">game boy</option>
                  <option value="paper">paper</option>
                  <option value="minimal">minimal</option>
                </select>
              </label>
              <label class="setting">
                <span>3d quality</span>
                <select id="optQuality">
                  <option value="high">high</option>
                  <option value="low">low (faster)</option>
                </select>
              </label>
              <label class="setting check"><input type="checkbox" id="optDeathcam" /> <span>instant replay when you die</span></label>
              <label class="setting">
                <span>terminal colour</span>
                <select id="optPalette">
                  <option value="green">green</option>
                  <option value="amber">amber</option>
                  <option value="white">white</option>
                </select>
              </label>
              <label class="setting">
                <span>terminal crt</span>
                <select id="optCrt">
                  <option value="soft">soft</option>
                  <option value="full">full</option>
                  <option value="off">off</option>
                </select>
              </label>
              <label class="setting">
                <span>touch</span>
                <select id="optTouch">
                  <option value="swipe">swipe</option>
                  <option value="dpad">swipe + d-pad</option>
                </select>
              </label>
              <label class="setting check"><input type="checkbox" id="optMotion" /> <span>reduced motion (no shake or flashes)</span></label>
              <label class="setting check"><input type="checkbox" id="optSound" /> <span>sound effects</span></label>
              <label class="setting check"><input type="checkbox" id="optMusic" /> <span>music</span></label>
              <label class="setting check"><input type="checkbox" id="optHaptics" /> <span>vibration / controller rumble</span></label>
              <button class="primary" id="settingsDone">[ done ]</button>
            </div>
          </div>
        </section>
      </main>

      <footer id="controls" class="controls">
        <button id="btnShed" class="ctl">shed</button>
        <div id="dpad" class="dpad hidden">
          <button data-dir="up" aria-label="Up">^</button>
          <button data-dir="left" aria-label="Left">&lt;</button>
          <button data-dir="right" aria-label="Right">&gt;</button>
          <button data-dir="down" aria-label="Down">v</button>
        </div>
        <button id="btnPause" class="ctl small" aria-label="Pause">||</button>
        <button id="btnAbility" class="ctl">surge</button>
      </footer>

      <div id="editorBar" class="editor-bar win hidden">
        <div class="win-bar"><span>editor.exe</span></div>
        <div class="win-body">
          <div class="tools" id="editorTools"></div>
          <details class="editor-options">
            <summary>level settings</summary>
            <div class="editor-grid">
              <label class="setting"><span>name</span><input id="edName" type="text" maxlength="32" /></label>
              <label class="setting"><span>food goal (0 = endless)</span><input id="edGoal" type="number" min="0" max="999" /></label>
              <label class="setting check"><input type="checkbox" id="edWrap" /> <span>wraparound edges</span></label>
              <label class="setting check"><input type="checkbox" id="edCollapse" /> <span>collapsing border</span></label>
              <label class="setting check"><input type="checkbox" id="edRival" /> <span>rival snake</span></label>
              <label class="setting check"><input type="checkbox" id="edMice" /> <span>mice</span></label>
              <label class="setting check"><input type="checkbox" id="edPowers" /> <span>power-ups</span></label>
              <div id="edTwists" class="twist-toggles"></div>
            </div>
          </details>
          <div class="row wrap">
            <button id="edTest" class="primary">[ test ]</button>
            <button id="edSave">[ save ]</button>
            <select id="edLoad" aria-label="Load a saved level"><option value="">load…</option></select>
            <button id="edShare">[ share link ]</button>
            <button id="edClear">[ clear ]</button>
            <button id="edExit">[ exit ]</button>
          </div>
          <p id="edStatus" class="dim small-text"></p>
        </div>
      </div>
    </div>
    <div class="crt" aria-hidden="true"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
